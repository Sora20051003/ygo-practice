# カードの発売日の対応表（data/release-dates.js）と自動処理用の EDOPro カードデータ（data/edo-cards.js）を毎日作り直し、変わっていれば自動で公開する。
# 禁止・制限リストとカードデータはアプリが自分で取りに行くので、ここでは発売日の表だけを扱う。
name: 発売日データの自動更新

on:
  schedule:
    - cron: "0 3 * * *"   # 毎日 12:00（日本時間）
  workflow_dispatch:       # 手動でも実行できる
    inputs:
      full:
        description: "サンプルデッキを全部作り直す（1 を入れる）"
        required: false
        default: ""
      altfull:
        description: "絵違いを全部のカードについて探し直す（1 を入れる）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 発売日の表を作り直す
        run: python3 .github/scripts/build_release_dates.py
      - name: 自動処理用の EDOPro カードデータを作り直す
        run: python3 .github/scripts/build_edo_cards.py
      - name: 絵違いの表を作り直す（EDOPro のカードデータも使うので、その後に。失敗しても、ほかの更新は続ける）
        env:
          FULL: ${{ inputs.altfull }}
        run: python3 .github/scripts/build_alt_arts.py || echo "絵違いの表の更新に失敗"
      - name: 発売前（情報が出ている）カードの表を作り直す（失敗しても、ほかの更新は続ける）
        run: python3 .github/scripts/build_prerelease.py || echo "発売前のカードの表の更新に失敗"
      - name: 効果の説明（選択肢の文）の表を作り直す（失敗しても、ほかの更新は続ける）
        run: python3 .github/scripts/build_edo_strs.py || echo "効果の説明の更新に失敗"
      - name: マスターデュエルのサンプルデッキを作り直す（失敗しても、ほかの更新は続ける）
        env:
          FULL: ${{ inputs.full }}
        run: python3 .github/scripts/build_md_samples.py || echo "サンプルデッキの更新に失敗"
      - name: OCG のサンプルデッキを作り直す・海外（TCG）のサンプルデッキも作る（失敗しても、ほかの更新は続ける）
        env:
          FULL: ${{ inputs.full }}
        run: python3 .github/scripts/build_ocg_samples.py || echo "OCG のサンプルデッキの更新に失敗"
      - name: 変わっていれば記録して公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 新しく作ったファイル（まだ記録していないもの）も含めて、data/ に変化があるか
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/   # 作り直したデータ（発売日・カードデータ・絵違い・サンプルデッキなど）を全部
          if [ -f data/edo-strs.js ]; then git add data/edo-strs.js; fi
          if [ -f data/md-samples.js ]; then git add data/md-samples.js; fi
          git add data/ocg-samples.js
          if [ -f data/tcg-samples.js ]; then git add data/tcg-samples.js; fi
          git commit -m "発売日・カードデータを自動更新"
          # 作っている間にほかの更新が送られていることがあるので、取り込んでから送る
          git pull --rebase
          git push
          # 自動の記録では公開が始まらないことがあるので、明示的に公開をやり直す
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
