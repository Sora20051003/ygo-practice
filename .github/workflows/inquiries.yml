# アプリの「問い合わせ」で送られたものを GitHub の Issue にする（.github/scripts/collect_inquiries.py）。
# 1回の実行で55分つないだまま待ち、届いたらすぐ Issue にする。5分ごとに次の回を予約し、前の回が終わったらすぐ始まるので、
# いつも受け取れる状態になっている（送ってから数秒〜1分で Issue になる）
name: 問い合わせをIssueにする

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

# 同時に動かすのは1つだけ。前の回が動いているあいだ、次の回は待つ（待つのは1つだけで、ほかは取り消される）
concurrency:
  group: inquiries
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 受け取る準備
        run: pip install --quiet paho-mqtt==2.1.0
      - name: 問い合わせを受け取って Issue にする
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SECONDS: "3300"
        run: python3 .github/scripts/collect_inquiries.py
