# アプリの「問い合わせ」で送られたものを GitHub の Issue にする（.github/scripts/collect_inquiries.py）。
# 1回の実行で55分つないだまま待ち、届いたらすぐ Issue にする。終わるときに次の回を自分で始めるので、
# いつも受け取れる状態になっている（送ってから数秒で Issue になる）。時間指定（cron）は途切れたときの予備
name: 問い合わせをIssueにする

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: write   # 終わるときに次の回を自分で始める（GitHub の時間指定は遅れたり動かなかったりするため）

# 同時に動かすのは1つだけ。前の回が動いているあいだ、次の回は待つ（待つのは1つだけで、ほかは取り消される）
concurrency:
  group: inquiries
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 受け取る準備
        run: pip install --quiet paho-mqtt==2.1.0
      - name: 問い合わせを受け取って Issue にする
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SECONDS: "3300"
        run: python3 .github/scripts/collect_inquiries.py
      - name: 次の回を始める（途切れずに待ち続ける）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run inquiries.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
