# アプリの「問い合わせ」で送られたものを GitHub の Issue にする（.github/scripts/collect_inquiries.py）。
# 5分ごとに実行し、1回の実行で約4分半つないだまま待つので、送ってから1分くらいで Issue になる
name: 問い合わせをIssueにする

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

# 前の回がまだ動いているときは、終わってから次を始める（同時に2つ動かさない）
concurrency:
  group: inquiries
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 受け取る準備
        run: pip install --quiet paho-mqtt==2.1.0
      - name: 問い合わせを受け取って Issue にする
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/collect_inquiries.py
